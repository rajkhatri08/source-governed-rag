# Alembic configuration. Run every alembic command from the repo root.

[alembic]
# Where the migrations live; %(here)s is the folder this file is in.
script_location = %(here)s/migrations

# Puts the repo root on sys.path, so migrations/env.py can import db.py and the evals package.
prepend_sys_path = .
path_separator = os

# There is deliberately no sqlalchemy.url here: migrations/env.py reads DATABASE_URL from the
# environment. A URL here would end up in git, and ConfigParser would read the "%" of a
# percent-encoded password (%40 for @) as interpolation.

# Logging, used by migrations/env.py: Alembic's own messages at INFO, everything else at WARNING.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
