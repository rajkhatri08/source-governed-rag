# Keeps the backend on Render's free instance awake during the demo period. Render puts a free instance to sleep
# after 15 minutes without a request, and the next request then waits about a minute while it starts again.
# Temporary: disable it afterwards (Actions tab, or `gh workflow disable keep-warm.yml`).
name: keep-warm

on:
  schedule:
    # Every 10 minutes at minutes 7, 17 … 57, from 02:07 to 18:57 UTC (07:37 to 00:27 IST): GitHub's cron runs
    # in UTC. Not at minute 0, because GitHub delays scheduled runs at the start of each hour and can drop them
    # under load. GitHub runs scheduled workflows only from the default branch (main).
    - cron: "7-59/10 2-18 * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab, to run it by hand

permissions: {} # the job only calls a public URL: it needs no access to the repository

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # --fail makes an HTTP error (400 or above) a failure; /health itself always answers 200 once the app is up.
      # Every failure is retried (--retry-all-errors), up to 12 times, 15 s apart, each attempt cut off after
      # 30 s: at most about 9.5 minutes, enough for an instance that is starting up.
      # --silent --show-error: no progress bar, but errors are printed.
      - run: curl --silent --show-error --fail --retry 12 --retry-delay 15 --retry-all-errors --max-time 30 https://source-governed-rag.onrender.com/health
